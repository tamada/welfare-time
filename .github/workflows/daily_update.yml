name: 毎朝のデータ更新（食堂＆キッチンカー）

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日UTC 22:00（JST 07:00 相当）
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 食堂データの更新
        run: |
          mkdir -p static/pdfs
          python scripts/fetch_cafeteria_pdf.py -o static/pdfs
          # static/pdfs/ 配下のPDFを対象にパース
          mkdir -p tmp
          for pdf in static/pdfs/*.pdf; do
            if [ -f "$pdf" ]; then
              target_json="static/cafeterias/$(basename "$pdf" .pdf).json"
              python scripts/parse_cafeteria_pdf.py "$pdf" -o "$target_json"
            fi
          done

      - name: キッチンカーデータの更新
        run: |
          mkdir -p data/kitchencars
          python scripts/fetch_kitchen_cars.py -o data/kitchencars/raw.html
          python scripts/scrape_kitchen_cars.py data/kitchencars/raw.html data/kitchencars/scraped.json

      - name: APIデータの生成
        run: |
          mkdir -p static/api
          python scripts/generator.py \
            --cafeteria-dir data/cafeterias \
            --kitchen-cars data/kitchencars/scraped.json \
            --master scripts/master.json \
            --output-dir static

      - name: gh-pagesブランチにデプロイ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # gh-pagesブランチをpublicディレクトリにworktreeとして追加
          git fetch origin gh-pages
          git worktree add public gh-pages

          hugo --minify

          cd public
          git add .
          git commit -m "Update site data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin gh-pages
