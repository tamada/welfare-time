name: 毎朝のデータ更新（食堂＆キッチンカー）

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日UTC 22:00（JST 07:00 相当）
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Python をセットアップする
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: 依存パッケージをインストールする
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 食堂データを更新する
        run: |
          make fetch_cafeteria
          make parse_pdf

      - name: キッチンカーデータを更新する
        run: |
          make fetch_kitchencar
          make parse_kitchencar

      - name: APIデータを生成する
        run:
          make generate

      - name: キッチンカーのアーカイブをmainにコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/kitchen_cars_past.json; then
            echo "No changes to the kitchen car archive"
            exit 0
          fi

          git add data/kitchen_cars_past.json
          git commit -m "Update kitchen car archive: $(date +'%Y-%m-%d')"
          # ジョブ実行中にmainが進んでいる場合に備えてrebaseしてからpushする。
          # 生成物（data/pdfs/.metadata.json など）で作業ツリーが汚れているため
          # --autostash がないとrebaseが失敗する。
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: NPMパッケージをインストールする
        run:
          npm ci

      - name: gh-pagesブランチにデプロイする
        run: |
          # gh-pagesブランチをpublicディレクトリにworktreeとして追加
          git fetch origin gh-pages
          git worktree add public gh-pages

          make build_html

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd public
          git add .
          git commit -m "Update site data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin gh-pages
