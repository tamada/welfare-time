name: 毎朝のデータ更新（食堂＆キッチンカー）

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日UTC 22:00（JST 07:00 相当）
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 食堂データの更新
        run: |
          make fetch_cafeteria
          make parse_pdf

      - name: キッチンカーデータの更新
        run: |
          make fetch_kitchencar
          make parse_kitchencar

      - name: APIデータの生成
        run: |
          make generate

      - name: gh-pagesブランチにデプロイ
        run: |
          # gh-pagesブランチをpublicディレクトリにworktreeとして追加
          git fetch origin gh-pages
          git worktree add public gh-pages

          make build_html

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd public
          git add .
          git commit -m "Update site data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin gh-pages
