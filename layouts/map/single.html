{{ define "main" }}
<div class="grid grid-cols-1 md:grid-cols-12 gap-1">
    <!-- Map (Left side from Tablet(md), Top on Mobile) -->
    <div class="md:col-span-7 lg:col-span-7">
        <div id="map-wrapper" class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
            <img src="{{ "assets/campus_map.jpg" | relURL }}" alt="Campus Map" class="w-full h-auto block">
            <div id="overlay" class="absolute inset-0 z-20"></div>
            
            <!-- Map Feedback (Hidden by default, shown via CSS/JS) -->
            <div id="map-feedback-overlay" class="absolute inset-0 z-30 bg-slate-900/60 backdrop-blur-[2px] hidden items-center justify-center transition-all duration-300">
                <span class="bg-white/90 dark:bg-slate-800/90 px-4 py-2 rounded-full text-sm font-bold shadow-xl border border-slate-200 dark:border-slate-700">
                    この店舗はマップ外です
                </span>
            </div>
        </div>
        
        <!-- Official Map Link -->
        <div class="mt-4 flex justify-center lg:justify-start">
            <a href="https://www.kyoto-su.ac.jp/campus/cam_map/" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400 rounded-lg text-xs font-bold transition-colors">
                <i class="bi bi-map-fill text-ksu dark:text-blue-400"></i>
                京都産業大学 キャンパスマップ (公式サイト)
                <i class="bi bi-box-arrow-up-right text-[10px]"></i>
            </a>
        </div>
    </div>

    <!-- Shop List (Right side from Tablet(md), Bottom on Mobile) -->
    <div class="md:col-span-5 lg:col-span-5">
        <div id="shop-grid" class="flex flex-col gap-1">
            <!-- Cards will be rendered here by main.js -->
            <div class="animate-pulse space-y-3">
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
            </div>
        </div>
    </div>
</div>
<div id="tooltip" class="fixed pointer-events-none z-50 bg-slate-900/90 text-white px-2 py-1 rounded text-xs hidden"></div>
{{ end }}
