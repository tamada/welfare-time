{{ define "main" }}
<div class="flex flex-col lg:flex-row gap-6">
    <!-- Left: Map Area -->
    <div class="lg:w-3/5 xl:w-2/3">
        <div id="map-wrapper" class="sticky top-[130px] border border-gray-200 rounded-lg overflow-hidden bg-white dark:bg-gray-800 dark:border-gray-700 max-h-[calc(100vh-180px)] flex items-center justify-center">
            <img src="{{ "assets/campus_map.jpg" | relURL }}" alt="Campus Map" class="max-w-full max-h-full w-auto h-auto object-contain block">
            <div id="overlay" class="absolute inset-0 pointer-events-none z-10"></div>
            <div id="map-feedback-overlay" class="absolute inset-0 bg-white/80 dark:bg-black/80 flex items-center justify-center opacity-0 transition-opacity z-20 pointer-events-none">
                <span class="text-xl font-bold text-gray-800 dark:text-white">この店舗はマップ外です</span>
            </div>
        </div>
        <div class="mt-4 flex justify-end">
            <a href="https://www.kyoto-su.ac.jp/campus/cam_map/" target="_blank" class="text-xs text-blue-600 hover:underline inline-flex items-center gap-1">
                <i class="bi bi-link-45deg"></i> 京都産業大学 キャンパスマップ
            </a>
        </div>
    </div>

    <!-- Right: Shop List -->
    <div class="lg:w-1/3 xl:w-1/4">
        <div id="shop-grid" class="flex flex-col gap-3">
            <!-- Shop items will be rendered here -->
        </div>
    </div>
</div>

{{ end }}
