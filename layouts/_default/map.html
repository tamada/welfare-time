{{ define "main" }}
<div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    <!-- Map (Left side from Tablet(md), Top on Mobile) -->
    <div class="md:col-span-6 lg:col-span-7">
        <div id="map-wrapper" class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
            <img src="{{ "assets/campus_map.jpg" | relURL }}" alt="Map" class="w-full h-auto block">
            <div id="overlay" class="absolute inset-0 z-20"></div>
        </div>
    </div>

    <!-- Shop List (Right side from Tablet(md), Bottom on Mobile) -->
    <div class="md:col-span-6 lg:col-span-5">
        <div id="shop-grid" class="flex flex-col gap-3">
            <!-- Cards will be rendered here by main.js -->
            <div class="animate-pulse space-y-3">
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
                <div class="h-24 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
            </div>
        </div>
    </div>
</div>
<div id="tooltip" class="fixed pointer-events-none z-50 bg-slate-900/90 text-white px-2 py-1 rounded text-xs hidden"></div>
{{ end }}
