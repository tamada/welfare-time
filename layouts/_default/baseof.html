<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シカク | {{ .Title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ "assets/style.css" | relURL }}">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'ksu-blue': '#00387D',
                        'status-open': '#28a745',
                        'status-closed': '#6c757d',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-sm flex flex-col min-h-screen dark:bg-gray-900 dark:text-gray-200">
    <header class="sticky top-0 z-[500]">
        {{ partial "navbar.html" . }}
        {{ partial "date_nav.html" . }}
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto w-full px-4 mt-4 mb-8">
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <!-- Modals (Tailwind implementation) -->
    <div id="modal-backdrop" class="hidden fixed inset-0 bg-black/50 z-[1000] flex items-center justify-center p-4">
        <!-- Filter Modal -->
        <div id="filterModal" class="hidden bg-white rounded-lg shadow-xl w-full max-w-md dark:bg-gray-800 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center dark:border-gray-700">
                <h5 class="font-bold">表示フィルタ</h5>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="bi bi-x-lg"></i></button>
            </div>
            <div id="filter-options-body" class="p-4 max-h-[60vh] overflow-y-auto"></div>
            <div class="px-4 py-3 border-t border-gray-200 flex justify-between dark:border-gray-700">
                <button id="reset-filter" class="text-xs text-blue-600 hover:underline">リセット</button>
                <button onclick="closeModal()" class="px-4 py-1 bg-gray-200 rounded text-xs dark:bg-gray-700">閉じる</button>
            </div>
        </div>

        <!-- Sort Modal -->
        <div id="sortModal" class="hidden bg-white rounded-lg shadow-xl w-full max-w-md dark:bg-gray-800 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center dark:border-gray-700">
                <h5 class="font-bold">並び替え</h5>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="radio" name="sortOption" value="status" class="sort-radio form-radio text-blue-600">
                    <span>営業状況順（営業中を優先）</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="radio" name="sortOption" value="name" class="sort-radio form-radio text-blue-600">
                    <span>名称順</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="radio" name="sortOption" value="location" class="sort-radio form-radio text-blue-600">
                    <span>場所順</span>
                </label>
            </div>
            <div class="px-4 py-3 border-t border-gray-200 text-right dark:border-gray-700">
                <button onclick="closeModal()" class="px-4 py-1 bg-gray-200 rounded text-xs dark:bg-gray-700">閉じる</button>
            </div>
        </div>

        <!-- Info Modal -->
        <div id="statusModal" class="hidden bg-white rounded-lg shadow-xl w-full max-w-md dark:bg-gray-800 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center dark:border-gray-700">
                <h5 class="font-bold">情報</h5>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="p-4">
                <div id="source-links" class="space-y-2"></div>
            </div>
            <div class="px-4 py-3 border-t border-gray-200 text-right dark:border-gray-700">
                <button onclick="closeModal()" class="px-4 py-1 bg-gray-200 rounded text-xs dark:bg-gray-700">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <script src="{{ "assets/main.js" | relURL }}"></script>
</body>
</html>
