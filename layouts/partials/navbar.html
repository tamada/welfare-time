<nav class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <!-- Brand -->
    <a href="{{ "" | relURL }}" class="flex items-center gap-2 group shrink-0">
        {{ with .Site.Params.brand_icon }}
        <img src="{{ . | relURL }}" alt="Logo" class="w-8 h-8 transition-transform group-hover:scale-110">
        {{ end }}
        <span class="font-black text-xl tracking-tighter text-ksu dark:text-blue-400">{{ .Site.Title }}</span>
    </a>
    
    <!-- Desktop/Mobile Nav -->
    <div class="flex items-center gap-1 md:gap-2 overflow-x-auto no-scrollbar py-2">
        <!-- Tools -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-full p-1 mr-2 shrink-0">
            <button onclick="reloadPage()" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400" title="更新">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button onclick="openModal('filterModal')" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400" title="表示フィルタ">
                <i class="bi bi-funnel"></i>
            </button>
            <button onclick="openModal('sortModal')" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400" title="並び替え">
                <i class="bi bi-sort-down"></i>
            </button>
            <button onclick="openModal('statusModal')" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400" title="情報">
                <i class="bi bi-info-circle"></i>
            </button>
        </div>
        
        <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1 md:mx-2 shrink-0"></div>

        <!-- Links -->
        <div class="flex items-center gap-1 md:gap-2 shrink-0">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-ksu dark:hover:text-blue-400 whitespace-nowrap">
                <i class="bi {{ .Params.icon }}"></i>
                <span class="hidden sm:inline">{{ .Name }}</span>
            </a>
            {{ end }}
        </div>

        <button id="btn-theme" class="p-2 ml-1 md:ml-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all shrink-0" title="テーマ切り替え">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>
</nav>
