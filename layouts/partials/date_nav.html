<div class="bg-white/50 dark:bg-slate-900/50 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-4 relative">
        
        <!-- Main Controls (Left/Center) -->
        <div class="flex items-center gap-3">
            <!-- Date Selector -->
            <div id="date-selector" class="flex items-center gap-3 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:border-ksu dark:hover:border-blue-500 transition-all cursor-pointer shadow-sm group">
                <i class="bi bi-calendar3 text-ksu dark:text-blue-400 group-hover:scale-110 transition-transform"></i>
                <span id="current-date-display" class="font-bold text-sm md:text-base">----年--月--日 (ー)</span>
                <input type="text" id="datepicker-input" class="absolute opacity-0 pointer-events-none w-0 h-0">
            </div>

            <!-- Nav Buttons -->
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg shadow-inner">
                <button id="prev-day" class="px-3 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-all text-xs font-bold text-slate-600 dark:text-slate-300">
                    <i class="bi bi-chevron-left"></i> 前日
                </button>
                <button id="today-btn" class="px-4 py-1.5 bg-ksu text-white rounded-md shadow-md text-xs font-black mx-1 transition-transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:scale-100">
                    今日
                </button>
                <button id="next-day" class="px-3 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-all text-xs font-bold text-slate-600 dark:text-slate-300">
                    翌日 <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Info Area (Right) -->
        <div class="text-right flex flex-col items-end gap-1">
            <div id="header-data-range" class="text-[10px] md:text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded"></div>
            <div id="status-info" class="text-[10px] text-slate-400 dark:text-slate-500 italic"></div>
        </div>
    </div>
</div>
