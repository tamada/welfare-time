<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>はらぺコ KSU</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-dark navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold py-0 d-flex align-items-center" href="index.html">
            <img src="./assets/icon_bg.svg" alt="Icon" width="40" height="40" class="me-2">
            <div class="d-flex flex-column align-items-start">
                <span>はらぺこ KSU</span>
                <div id="header-data-range" class="text-light x-small opacity-75 fw-normal"></div>
            </div>
        </a>
        
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarActions">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarActions">
            <div class="navbar-nav ms-auto gap-1">
                <div class="nav-icon-btn" id="btn-grid-view">
                    <i class="bi bi-grid-fill"></i>
                    <span class="d-lg-none">カード表示</span>
                </div>
                <div class="nav-icon-btn" id="btn-list-view">
                    <i class="bi bi-list-ul"></i>
                    <span class="d-lg-none">リスト表示</span>
                </div>
                <div class="nav-icon-btn" id="btn-filter" data-bs-toggle="modal" data-bs-target="#filterModal">
                    <i class="bi bi-filter"></i>
                    <span class="d-lg-none">表示フィルタ</span>
                </div>
                <div class="nav-icon-btn" id="btn-sort" data-bs-toggle="modal" data-bs-target="#sortModal">
                    <i class="bi bi-sort-down"></i>
                    <span class="d-lg-none">並び替え</span>
                </div>
                <div class="nav-icon-btn" id="btn-reload">
                    <i class="bi bi-arrow-clockwise"></i>
                    <span class="d-lg-none">最新に更新</span>
                </div>
                <div class="nav-icon-btn" id="btn-theme" title="テーマ切り替え">
                    <i class="bi bi-moon-fill"></i>
                </div>
                <a href="https://github.com/tamada/harapeco" target="_blank" class="nav-icon-btn">
                    <i class="bi bi-github"></i>
                    <span class="d-lg-none">GitHubリポジトリ</span>
                </a>
                <a href="help/index.html" class="nav-icon-btn">
                    <i class="bi bi-question-circle"></i>
                    <span class="d-lg-none">ヘルプ・使い方</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Filter Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">表示フィルタ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="filter-options-body" class="modal-body"></div>
            <div class="modal-footer">
                <button type="button" id="reset-filter" class="btn btn-outline-secondary btn-sm me-auto">リセット</button>
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">閉じる</button>
            </div>
        </div>
    </div>
</div>

<!-- Sort Modal -->
<div class="modal fade" id="sortModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">並び替え</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-check mb-3">
                    <input class="form-check-input sort-radio" type="radio" name="sortOption" id="sort-status" value="status">
                    <label class="form-check-label w-100" for="sort-status">営業状況順（営業中を優先）</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input sort-radio" type="radio" name="sortOption" id="sort-name" value="name">
                    <label class="form-check-label w-100" for="sort-name">名称順</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input sort-radio" type="radio" name="sortOption" id="sort-location" value="location">
                    <label class="form-check-label w-100" for="sort-location">場所順</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">閉じる</button>
            </div>
        </div>
    </div>
</div>

<div class="date-nav">
    <div class="container d-flex justify-content-between align-items-center">
        <button id="prev-day" class="btn btn-light btn-sm px-3">前日</button>
        
        <div class="d-flex align-items-center gap-2">
            <div id="date-selector" class="date-display-wrapper d-flex align-items-center">
                <i class="bi bi-calendar3 text-primary me-2"></i>
                <span id="current-date-display" class="fw-bold">----年--月--日</span>
            </div>
            <button id="today-btn" class="btn btn-light btn-sm px-3 fw-bold text-primary">今日</button>
            <input type="date" id="datepicker-input">
        </div>

        <button id="next-day" class="btn btn-light btn-sm px-3">翌日</button>
    </div>
</div>

<div class="container">
    <div id="loading-overlay"><div class="spinner-border spinner-border-sm text-primary"></div></div>
    <div class="row g-2" id="shop-grid"></div>
</div>

<footer>
    <div class="container text-center">
        <div id="status-info" class="mb-2"></div>
        <div id="source-links" class="small"></div>
        <div class="mt-2">
            &copy; 2026 はらぺこ KSU / 
            <a href="https://github.com/tamada/harapeco" class="footer-link" target="_blank">GitHub</a>
        </div>
    </div>
</footer>

<script src="assets/main.js"></script>
</body>
</html>
