<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Map Debugger</title>
    <style>
        #map-container { position: relative; display: inline-block; cursor: crosshair; }
        #coords { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="map-container">
        <img src="campus_map.jpg" alt="Map">
        <div id="coords">X: 0, Y: 0</div>
    </div>
    <script>
        const container = document.getElementById('map-container');
        const coords = document.getElementById('coords');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            coords.innerText = `X: ${x}, Y: ${y}`;
        });
        container.addEventListener('click', (e) => {
            const rect = container.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            console.log(`Building at: { "x": ${x}, "y": ${y} }`);
            alert(`X: ${x}, Y: ${y} (Copied to console)`);
        });
    </script>
</body>
</html>
